services:
  - type: web
    name: weitron-backend
    runtime: python
    plan: free
    rootDir: apps/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: DATABASE_URL
        sync: false # 貼上 Supabase 的 PostgreSQL 連線字串
      - key: JWT_SECRET_KEY
        generateValue: true # Render 會自動產生一組隨機值
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "120"
      - key: UPLOAD_DIR
        value: ./uploads
      - key: CORS_ORIGINS
        sync: false # 貼上 Vercel 網域，例如 https://your-app.vercel.app（本地開發不受影響）
      - key: SUPABASE_URL
        sync: false # 例如 https://iqfpsituvyryhvpyqoea.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Supabase 後台 Project Settings > API 的 service_role key，絕對不能外流
      - key: SUPABASE_STORAGE_BUCKET
        value: media
      # 以下四個 AWS S3 設定：四個都填才會生效，且優先權高於上面的 Supabase Storage
      # （新上傳的圖片/影片會改走 S3，舊的仍留在 Supabase，兩邊並存不衝突）。
      # 不需要用 S3 的話，這四個留空即可，行為跟原本一樣。
      - key: AWS_ACCESS_KEY_ID
        sync: false # IAM 使用者的 Access Key ID
      - key: AWS_SECRET_ACCESS_KEY
        sync: false # IAM 使用者的 Secret Access Key，絕對不能外流
      - key: AWS_REGION
        sync: false # 例如 ap-northeast-1（東京）、ap-southeast-1（新加坡）
      - key: AWS_S3_BUCKET
        sync: false # 你在 S3 建立的儲存貯體名稱
